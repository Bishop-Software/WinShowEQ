[package]
name = "winshoweq-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "WinShowEQClient"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
clap = { version = "4", features = ["derive"] }
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
quick-xml = "0.36"
serde_json = "1"
chrono = "0.4"
tts = "0.26"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
ureq = "2"
rfd = "0.14"
egui_dock = "0.19"
egui_extras = { version = "0.34", features = ["image"] }

[dev-dependencies]
tempfile = "3"